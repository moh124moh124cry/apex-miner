name: APXN Cloudflare build probe

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - .github/workflows/apxn-cloudflare-check.yml
      - package.json
      - package-lock.json
      - app/**
      - lib/**
      - next.config.mjs
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: read

jobs:
  probe-cloudflare-build:
    name: Test Cloudflare build without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install original APXN packages
        run: npm ci

      - name: Report Cloudflare compatibility
        run: npx --yes vinext@latest check

      # Next.js 14 requires React 18, while this vinext build uses React 19.
      # This operation takes place ONLY in the temporary Actions runner.
      - name: Isolate Cloudflare build from Next 14 dependency conflict
        run: npm uninstall next eslint-config-next

      # No changes are committed to GitHub by this job.
      - name: Prepare temporary Cloudflare build configuration
        run: npx --yes vinext@latest init --platform=cloudflare --skip-check

      # Fake credentials are for compilation only. Never put real secrets here.
      - name: Build temporary Cloudflare bundle (no deployment)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-credential
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-real-credential
          BOT_TOKEN: 000000000:ci-placeholder-not-a-real-bot-token
        run: npm run build:vinext

      # Save configuration ONLY, not .env files or the built bundle.
      # The artifact lets us inspect vinext's generated files before any deploy.
      - name: Export generated configuration for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: apxn-cloudflare-generated-config
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          path: |
            package.json
            package-lock.json
            vite.config.ts
            wrangler.jsonc
            postcss.config.cjs
            tailwind.config.cjs
            .gitignore

