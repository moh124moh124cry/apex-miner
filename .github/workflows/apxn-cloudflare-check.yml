name: APXN Cloudflare direct build check

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - .github/workflows/apxn-cloudflare-check.yml
      - package.json
      - package-lock.json
      - app/**
      - lib/**
      - public/**
      - next.config.mjs
      - vite.config.ts
      - wrangler.jsonc
      - postcss.config.js
      - postcss.config.cjs
      - tailwind.config.js
      - tailwind.config.cjs
      - .gitignore

permissions:
  contents: read

jobs:
  direct-cloudflare-build:
    name: Build committed APXN Cloudflare configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out Cloudflare migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exactly the committed dependencies
        run: npm ci

      - name: Check committed vinext compatibility
        run: npm exec -- vinext check

      # Compile the actual files committed to cloudflare-migration.
      # Do NOT run vinext init or uninstall packages in this test.
      # The placeholder values are NOT real credentials.
      # No requests are sent to Telegram or the real Supabase project.
      - name: Build committed Cloudflare app without deploying
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-credential
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-real-credential
          BOT_TOKEN: 000000000:ci-placeholder-not-a-real-bot-token
        run: npm run build:vinext

