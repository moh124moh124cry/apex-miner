name: APXN Cloudflare build probe

on:
  workflow_dispatch:
  push:
    branches:
      - cloudflare-migration
    paths:
      - .github/workflows/apxn-cloudflare-check.yml
      - package.json
      - package-lock.json
      - app/**
      - lib/**
      - next.config.mjs
      - postcss.config.js
      - tailwind.config.js

permissions:
  contents: read

jobs:
  probe-cloudflare-build:
    name: Test Cloudflare build without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out experimental branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install original APXN packages
        run: npm ci

      - name: Report Cloudflare compatibility
        run: npx --yes vinext@latest check

      # vinext needs React 19, while Next 14 requires React 18.
      # Remove Next ONLY inside this temporary GitHub Actions runner.
      # No change is committed, and Vercel production is untouched.
      - name: Isolate Cloudflare build from Next 14 dependency conflict
        run: npm uninstall next eslint-config-next

      # Changes here stay in the temporary runner; nothing is committed.
      - name: Prepare temporary Cloudflare build configuration
        run: npx --yes vinext@latest init --platform=cloudflare --skip-check

      # These placeholders are NOT real Supabase or Telegram credentials.
      # Nothing is deployed and no user balances are touched.
      - name: Build temporary Cloudflare bundle (no deployment)
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-not-a-real-credential
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key-not-a-real-credential
          BOT_TOKEN: 000000000:ci-placeholder-not-a-real-bot-token
        run: npm run build:vinext

